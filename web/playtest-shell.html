<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#102d3a">
  <link rel="icon" href="data:,">
  <title>$GODOT_PROJECT_NAME — Web Play Test</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #102d3a; color: #e0f0ef; font-family: system-ui, sans-serif; }
    body { position: fixed; inset: 0; touch-action: none; }
    #game { position: absolute; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #start-screen { position: absolute; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center; padding: 24px; background: #102d3a; }
    h1 { margin: 0; font-size: clamp(24px, 5vw, 36px); }
    p { margin: 0; line-height: 1.6; }
    button { min-width: 220px; min-height: 56px; border: 2px solid #a0d5d0; background: #244a56; color: #f1fcf9; font: inherit; font-weight: 700; }
    button:disabled { opacity: .6; }
    #orientation { display: none; position: absolute; inset: 0; z-index: 3; background: #102d3a; place-content: center; text-align: center; padding: 24px; }
    @media (orientation: portrait) { #orientation { display: grid; } }
    #status { max-width: 36em; white-space: pre-wrap; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <main id="game">
    <canvas id="canvas" tabindex="0" aria-label="琵琶湖深度 ゲーム画面"></canvas>
    <section id="start-screen">
      <h1>琵琶湖深度</h1>
      <p>BIWAKO SHINDO · Web Play Test</p>
      <button id="start" type="button">タップして開始</button>
      <p id="status" role="status">横持ちでプレイしてください。<br>音が出ます。通常ブラウザで開いてください。</p>
    </section>
    <section id="orientation"><p>スマートフォンを横向きにしてください。</p></section>
  </main>
  <noscript>JavaScriptを有効にしてください。</noscript>
  <script src="$GODOT_URL"></script>
  <script>
    const GODOT_CONFIG = $GODOT_CONFIG;
    const engine = new Engine(GODOT_CONFIG);
    const start = document.getElementById('start');
    const status = document.getElementById('status');
    const canvas = document.getElementById('canvas');
    // Page controls only. The engine keeps all existing touch and save behavior.
    for (const name of ['gesturestart', 'gesturechange', 'gestureend']) {
      document.addEventListener(name, event => event.preventDefault(), {passive: false});
    }
    start.addEventListener('click', () => {
      start.disabled = true;
      const missing = Engine.getMissingFeatures({threads: false});
      if (missing.length) {
        status.textContent = 'このブラウザでは起動できません。\n' + missing.join('\n');
        return;
      }
      status.textContent = '読み込み中…';
      // User gesture starts loading; Godot handles AudioContext unlocking on canvas input.
      engine.startGame({onProgress: (current, total) => {
        if (total > 0) status.textContent = '読み込み中… ' + Math.round(current / total * 100) + '%';
      }}).then(() => {
        document.getElementById('start-screen').remove();
        canvas.focus();
      }).catch(error => {
        status.textContent = '起動できませんでした。ページを再読み込みしてください。\n' + String(error);
        console.error(error);
      });
    });
  </script>
</body>
</html>
