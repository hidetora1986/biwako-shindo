(()=>{'use strict';

function room(t){
 const wall=ctx.createLinearGradient(0,0,0,490);wall.addColorStop(0,'#172633');wall.addColorStop(.6,'#28323a');wall.addColorStop(1,'#161c28');ctx.fillStyle=wall;ctx.fillRect(-500,0,2000,600);

 path([[0,0],[94,65],[90,440],[0,530]],'#101b25');path([[960,0],[869,62],[870,441],[960,538]],'#101820');
 path([[0,0],[960,0],[868,64],[93,64]],'#101c25');line([[93,64],[867,64]],'#70818a27',3);line([[0,443],[960,443]],'#070e19',11);line([[0,450],[960,450]],'#a6a9a524',2);

 for(let i=-9;i<20;i++){let x=i*92;line([[480+(x-480)*.7,450],[x*1.9-380,600]],'#7d645632',2)}for(let y=475;y<=590;y+=(y-430)*.18)line([[0,y],[960,y]],'#050c1799',3);
 // window with cold night light

 // painting (haunted hint)

 line([[479,0],[480,119]],'#657076',2);path([[442,121],[518,121],[538,147],[421,147]],'#202b32','#687582',3);ellipse(480,151,32,5,'#7d8c8470');
 ctx.fillStyle=grad(480,240,280,'#b8c1aa12','#b8c1aa00');ctx.fillRect(200,60,560,510);
 // fine imperfections
 line([[322,82],[325,110],[317,139]],'#050e193b',2);line([[734,203],[722,225],[735,241]],'#6c777620',1);
 const v=ctx.createRadialGradient(480,296,70,480,300,635);v.addColorStop(0,'#00000000');v.addColorStop(.62,'#03070942');v.addColorStop(1,'#000b15dc');ctx.fillStyle=v;ctx.fillRect(-300,-100,1500,800);

function girl(t,horror=0,standing=0){

 const h=smooth(horror);
 // shoulder-length hair behind face
 ctx.fillStyle=h>.35?'#090b12':'#252530';
 ctx.beginPath();ctx.moveTo(-52,-33);ctx.bezierCurveTo(-67,5,-69,57,-54,79);ctx.quadraticCurveTo(-40,95,-26,74);ctx.lineTo(28,74);ctx.quadraticCurveTo(57,95,57,73);ctx.bezierCurveTo(69,41,59,-15,46,-41);ctx.closePath();ctx.fill();
 // legs & socks
 ctx.fillStyle='#e8c4b6';roundRect(-35,158,28,58,10);ctx.fill();roundRect(8,158,28,58,10);ctx.fill();ctx.fillStyle='#d7d7ce';ctx.fillRect(-35,195,28,24);ctx.fillRect(8,195,28,24);
 ellipse(-23,220,20,12,'#242530');ellipse(24,220,20,12,'#242530');
 // dress, frill and cardigan
 ctx.fillStyle='#d3c7be';path([[-39,65],[41,65],[62,181],[-58,181]],'#d5c5bb');ctx.fillStyle='#f2d9cd';ctx.fillRect(-56,170,114,9);
 path([[-29,54],[-70,77],[-60,146],[-35,149],[-29,113]],'#b4c9c4');path([[29,54],[69,77],[60,146],[35,149],[28,113]],'#b4c9c4');
 path([[-32,52],[0,80],[32,52],[37,151],[-37,151]],'#e0cfbc');
 line([[0,78],[0,149]],'#b8aa9b',1);for(let y=89;y<149;y+=19)ellipse(0,y,2,2,'#a78e81');
 // arms/hands resting on knees
 ctx.strokeStyle='#b7c5bc';ctx.lineWidth=24;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-54,88);ctx.lineTo(-44,157);ctx.lineTo(-24,163);ctx.moveTo(54,88);ctx.lineTo(44,157);ctx.lineTo(24,163);ctx.stroke();ellipse(-25,168,13,9,'#e8bcb2');ellipse(25,168,13,9,'#e8bcb2');
 // neck
 ctx.fillStyle='#e4b6a7';roundRect(-15,42,30,33,8);ctx.fill();

 const skin=ctx.createLinearGradient(-49,-36,49,54);skin.addColorStop(0,h>.5?'#d5b3a6':'#f6daca');skin.addColorStop(1,h>.5?'#a17d7b':'#dda99c');
 ctx.fillStyle=skin;ctx.beginPath();ctx.moveTo(-49,-19);ctx.bezierCurveTo(-50,16,-38,49,-8,59);ctx.quadraticCurveTo(0,64,9,59);ctx.bezierCurveTo(38,50,50,17,49,-19);ctx.bezierCurveTo(46,-73,-46,-72,-49,-19);ctx.fill();
 // hair cap / bangs
 ctx.fillStyle=h>.55?'#090b10':'#282936';ctx.beginPath();ctx.moveTo(-51,-21);ctx.bezierCurveTo(-64,-89,-11,-93,21,-77);ctx.bezierCurveTo(59,-69,58,-34,49,-16);ctx.lineTo(44,-29);ctx.lineTo(31,-36);ctx.lineTo(19,-33);ctx.lineTo(11,-40);ctx.lineTo(-1,-32);ctx.lineTo(-14,-38);ctx.lineTo(-29,-31);ctx.lineTo(-47,-13);ctx.closePath();ctx.fill();
 ctx.fillStyle='#68606b3b';path([[-29,-65],[-18,-72],[-11,-46]],'#5a535b62');path([[8,-70],[18,-65],[23,-46]],'#5a535b50');
 // hair lock

 // face: soft anime eyes vs entirely hollow

 }

}
function drawEye(eye,t){const life=clamp((t-eye.born)/.28,0,1);if(life<=0)return;
 const p=smooth(life),pulse=1+Math.sin(t*2.2+eye.phase)*.042;ctx.save();ctx.translate(eye.x,eye.y);ctx.rotate(eye.angle);ctx.scale(p*pulse,p*pulse);let r=eye.r;

 for(let i=0;i<8;i++){let a=i*Math.PI/4+eye.phase;let cr=r*.85;line([[Math.cos(a)*cr,Math.sin(a)*cr*.55],[Math.cos(a)*r*1.22,Math.sin(a)*r*.63]],'#c08b8a80',1)}
 let px=clamp((480-eye.x)*.022,-r*.2,r*.2),py=clamp((273-eye.y)*.016,-r*.14,r*.14);ellipse(px,py,r*.46,r*.5,'#844452');ellipse(px,py,r*.35,r*.39,'#45202c');ellipse(px,py,r*.23,r*.34,'#0a0c17');ellipse(px-r*.13,py-r*.18,r*.1,r*.1,'#ffffffd5');
 line([[-r*1.25,-r*.08],[-r*.68,-r*.44],[r*.4,-r*.46],[r*1.28,-r*.07]],'#4a252f',2.4);ctx.restore();}

 return {id:eyesId++,x,y,r:rand(22,33),born:elapsed,phase:rand(0,6.28),angle:rand(-.16,.16),dieAt:null};}

function splat(eye){for(let i=0;i<18;i++){const a=rand(0,Math.PI*2),v=rand(60,230);particles.push({x:eye.x,y:eye.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.3,.7),max:.7,r:rand(1.7,4.2)})}}
function drawParticles(dt){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}ellipse(p.x,p.y,p.r*p.life/.7,p.r*p.life/.7,`rgba(128,32,51,${Math.min(.88,p.life*1.5)})`)}}
let AC=window.AudioContext||window.webkitAudioContext;
function initSound(){if(!AC)return;if(!sound){let ac=new AC(),master=ac.createGain();master.gain.value=0.33;master.connect(ac.destination);let amb=ac.createOscillator(),amb2=ac.createOscillator(),g=ac.createGain();amb.type='sine';amb.frequency.value=55;amb2.type='sine';amb2.frequency.value=56.9;g.gain.value=.045;amb.connect(g);amb2.connect(g);g.connect(master);amb.start();amb2.start();sound={ac,master,amb,amb2,g}}if(sound.ac.state==='suspended')sound.ac.resume().catch(()=>{});sound.master.gain.setTargetAtTime(soundOn?.30:0,sound.ac.currentTime,.05)}
function tone(type){if(!sound||!soundOn)return;const a=sound.ac,osc=a.createOscillator(),gain=a.createGain(),now=a.currentTime;osc.connect(gain);gain.connect(sound.master);let f=200,d=.2,v=.25;
 if(type==='pop'){f=120;d=.22;v=.55;osc.type='triangle'}if(type==='appear'){f=460;d=.35;v=.1;osc.type='sine'}if(type==='scare'){f=90;d=1.2;v=1.1;osc.type='sawtooth'}if(type==='quiet'){f=360;d=.8;v=.09;osc.type='sine'}
 osc.frequency.setValueAtTime(f,now);osc.frequency.exponentialRampToValueAtTime(Math.max(25,f*(type==='scare'?2.3:.25)),now+d);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(v,now+.02);gain.gain.exponentialRampToValueAtTime(.0001,now+d);osc.start(now);osc.stop(now+d+.01);
}
function setMessage(txt,horror=false){message.textContent=txt;message.hidden=!txt;message.classList.toggle('horror',horror)}
function start(){state='play';elapsed=0;startTime=performance.now();lastFrame=startTime;eyes=[];particles=[];count=0;spawnAt=.35;eyesId=1;lastStage=-1;shake=0;countEl.textContent='00';clockEl.textContent='01:00';startScreen.hidden=true;endScreen.hidden=true;hud.hidden=false;hint.hidden=false;setMessage('');initSound();}
function finish(){if(state==='done')return;state='done';endScreen.hidden=false;hud.hidden=true;hint.hidden=true;message.hidden=true;document.getElementById('result').textContent=`CLOSED EYES — ${String(count).padStart(2,'0')}`;if(sound){sound.master.gain.setTargetAtTime(0,sound.ac.currentTime,.5)}}
function poke(clientX,clientY){if(state!=='play'||elapsed>=EMPTY_AT)return;const r=canvas.getBoundingClientRect(),x=viewX+(clientX-r.left)/r.width*viewW,y=(clientY-r.top)/r.height*VH;let chosen=-1,best=1e6;for(let i=0;i<eyes.length;i++){let e=eyes[i],d=Math.hypot((e.x-x)*.85,e.y-y);if(d<Math.max(40,e.r*1.5)&&d<best){best=d;chosen=i}}if(chosen>=0){const e=eyes.splice(chosen,1)[0];splat(e);count++;countEl.textContent=String(count).padStart(2,'0');shake=2.5;tapFlash=.1;tone('pop')}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();poke(e.clientX,e.clientY)},{passive:false});
function tick(now){requestAnimationFrame(tick);let dt=Math.min(.05,(now-lastFrame)/1000||.016);lastFrame=now;
 if(state==='play'){
 elapsed=Math.min(DURATION,(now-startTime)/1000);clockEl.textContent=`00:${String(Math.max(0,Math.ceil(DURATION-elapsed))).padStart(2,'0')}`;let stageId=elapsed<EMPTY_AT?0:elapsed<RISE_AT?1:elapsed<RUSH_AT?2:3;
 if(stageId!==lastStage){lastStage=stageId;if(stageId===1){eyes=[];hint.textContent='……静かになった。';tone('quiet')}if(stageId===2){hint.textContent='';tone('quiet')}if(stageId===3){hint.textContent='';tone('scare');shake=10}}
 if(elapsed<EMPTY_AT&&elapsed>=spawnAt){spawnEye();spawnAt=elapsed+rand(elapsed<20?1.5:.8,elapsed<20?2.2:1.5)}
 if(stageId===1){if(elapsed<49)setMessage('');else if(elapsed<52)setMessage('……');else if(elapsed<55)setMessage('もう、いない……？');else setMessage('……ありがとう。')}
 else if(stageId===2)setMessage('み な い で',true);
 else if(stageId===3)setMessage(elapsed<59.2?'見ないで！':'見　な　い　で',true);
 else setMessage('');
 if(elapsed>=DURATION)finish();}
 shake=Math.max(0,shake-dt*14);tapFlash=Math.max(0,tapFlash-dt*2);
 render(dt,now/1000);
}
function render(dt,now){const sx=canvas.width/(cssW),sy=canvas.height/(cssH);ctx.setTransform(sx,0,0,sy,0,0);ctx.fillStyle='#050b12';ctx.fillRect(0,0,cssW,cssH);
 ctx.save();let sc=cssH/VH;ctx.scale(sc,sc);ctx.translate(-viewX,0);
 if(state==='play'&&shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake))}
 room(now);chair();
 let stand=state==='play'?smooth((elapsed-RISE_AT)/1.4):0;
 let rush=state==='play'?smooth((elapsed-RUSH_AT)/2.8):0;
 let scale=1+rush*7.6;
 ctx.save();ctx.translate(480,266+stand*(-26)+rush*54);ctx.scale(scale,scale);girl(now,clamp((elapsed-55.5)/2.4,0,1),stand);ctx.restore();
 if(state==='play')for(const e of eyes)drawEye(e,elapsed);
 if(state==='play')drawParticles(dt);
 if(state==='play'&&elapsed>=RUSH_AT){let p=smooth((elapsed-RUSH_AT)/2.8);ctx.fillStyle=`rgba(84,0,16,${p*.46})`;ctx.fillRect(viewX,0,viewW,VH);if(elapsed>59.4){ctx.fillStyle=`rgba(255,241,223,${smooth((elapsed-59.4)/.4)*.7})`;ctx.fillRect(viewX,0,viewW,VH)}}
 if(state==='play'&&elapsed>=EMPTY_AT&&elapsed<RISE_AT){ctx.fillStyle=`rgba(6,12,20,${.15*smooth((elapsed-EMPTY_AT)/3)})`;ctx.fillRect(viewX,0,viewW,VH)}
 ctx.restore();flash.style.opacity=String(Math.max(tapFlash*.9,state==='play'&&elapsed>=59.5?smooth((elapsed-59.5)/.35)*.7:0));}
 document.getElementById('start').addEventListener('click',start);document.getElementById('restart').addEventListener('click',start);muteBtn.addEventListener('click',()=>{soundOn=!soundOn;muteBtn.textContent=soundOn?'♪':'×';muteBtn.setAttribute('aria-label',soundOn?'音声をオフにする':'音声をオンにする');if(sound){sound.master.gain.setTargetAtTime(soundOn?.3:0,sound.ac.currentTime,.07)}});
 window.__eyeGame={getState:()=>({state,elapsed,count,eyes:eyes.map(e=>({x:e.x,y:e.y,r:e.r}))}),skipTo:(s)=>{if(state==='play')startTime=performance.now()-s*1000},start};requestAnimationFrame(tick);
})();
</script>
